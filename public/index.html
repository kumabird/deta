<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini Browser</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    #urlBar { width: 70%; padding: 5px; }

    iframe {
      width: 100%;
      height: 80vh;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    /* タブ */
    .tabs { margin-top: 15px; }
    .tab {
      display: inline-block;
      padding: 8px 15px;
      background: #ddd;
      margin-right: 5px;
      cursor: pointer;
      border-radius: 5px 5px 0 0;
    }
    .tab.active {
      background: #fff;
      border-bottom: 2px solid #fff;
      font-weight: bold;
    }

    /* パネル */
    .panel {
      display: none;
      border: 1px solid #ccc;
      padding: 10px;
      background: #fff;
    }
    .panel.active { display: block; }

    textarea {
      width: 100%;
      height: 20vh;
      font-family: monospace;
      white-space: pre;
    }
  </style>
</head>
<body>

  <input id="urlBar" placeholder="https://example.com">

  <!-- SPAモード -->
  <button onclick="loadUrl()">移動（SPAモード）</button>

  <!-- 普通に開く -->
  <button onclick="openNormal()">普通に開く</button>

  <iframe id="preview"></iframe>

  <!-- ▼ タブ -->
  <div class="tabs">
    <div class="tab active" data-type="html">HTML</div>
    <div class="tab" data-type="css">CSS</div>
    <div class="tab" data-type="js">JS</div>
  </div>

  <!-- ▼ パネル -->
  <div id="panel-html" class="panel active">
    <textarea id="htmlView"></textarea>
  </div>

  <div id="panel-css" class="panel">
    <textarea id="cssView"></textarea>
  </div>

  <div id="panel-js" class="panel">
    <textarea id="jsView"></textarea>
  </div>

  <script>
    // ▼ タブ切り替え
    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));

        tab.classList.add("active");
        document.getElementById("panel-" + tab.dataset.type).classList.add("active");
      };
    });

    // ▼ SPAモード
    function loadUrl() {
      const url = document.getElementById("urlBar").value;
      load(url);
    }

    async function load(url) {
      const res = await fetch("/fetch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      const data = await res.json();

      // HTML
      document.getElementById("htmlView").value = data.html;

      // CSS 抽出
      const css = [...data.html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)]
        .map(m => m[1]).join("\n\n");
      document.getElementById("cssView").value = css;

      // JS 抽出
      const js = [...data.html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)]
        .map(m => m[1]).join("\n\n");
      document.getElementById("jsView").value = js;

      // ▼ プレビュー（SPA対応）
      document.getElementById("preview").srcdoc =
        injectPatches(data.html, data.base);
    }

    // ▼ 普通に開く
    function openNormal() {
      const url = document.getElementById("urlBar").value;
      document.getElementById("preview").src = url;
    }

    // ▼ SPA対応パッチ
    function injectPatches(html, base) {
      return `
        <script>
          const originalFetch = window.fetch;
          window.fetch = function(url, options) {
            const absolute = new URL(url, "${base}").href;
            return originalFetch("/proxy?url=" + absolute, options);
          };

          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (const r of regs) r.unregister();
            });
          }

          document.addEventListener("click", function(e) {
            const a = e.target.closest("a");
            if (!a) return;
            e.preventDefault();
            const absolute = new URL(a.getAttribute("href"), "${base}").href;
            window.parent.postMessage({ url: absolute }, "*");
          });
        <\/script>
      ` + html;
    }

    // ▼ iframe 内リンク → 親で load()
    window.addEventListener("message", (e) => {
      if (e.data.url) load(e.data.url);
    });
  </script>

</body>
</html>
