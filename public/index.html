<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Frame Browser</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    #urlBar { width: 80%; padding: 5px; }
    #controls { margin-bottom: 10px; }
    iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
    .frame-container { display: flex; width: 100%; height: 600px; }
    .frame-item { flex: 1; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <input id="urlBar" placeholder="https://example.com">
    <button onclick="loadUrl()">移動</button>
  </div>

  <div id="viewer"></div>

  <script>
    const historyStack = [];
    let historyIndex = -1;

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        load(historyStack[historyIndex], false);
      }
    }

    function goForward() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        load(historyStack[historyIndex], false);
      }
    }

    function loadUrl() {
      const url = document.getElementById("urlBar").value;
      load(url, true);
    }

    async function load(url, pushHistory) {
      if (pushHistory) {
        historyStack.splice(historyIndex + 1);
        historyStack.push(url);
        historyIndex++;
      }

      document.getElementById("urlBar").value = url;

      const res = await fetch("/fetch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      render(data);
    }

    function render(data) {
      const viewer = document.getElementById("viewer");

      if (data.type === "html") {
        viewer.innerHTML = `<iframe srcdoc="${escapeHtml(injectPatches(data.html))}"></iframe>`;
        return;
      }

      if (data.type === "frameset") {
        let html = `<div class='frame-container'>`;

        for (const f of data.frames) {
          const content = f.content.html ? injectPatches(f.content.html) : "";
          html += `
            <iframe class="frame-item" srcdoc="${escapeHtml(content)}"></iframe>
          `;
        }

        html += `</div>`;
        viewer.innerHTML = html;
      }
    }

    function injectPatches(html) {
      return `
        <script>
          const originalFetch = window.fetch;
          window.fetch = function(url, options) {
            try {
              const absolute = new URL(url, window.location.href).href;
              return originalFetch("/proxy?url=" + absolute, options);
            } catch {
              return originalFetch(url, options);
            }
          };

          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (const r of regs) r.unregister();
            });
          }

          document.addEventListener("click", function(e) {
            const a = e.target.closest("a");
            if (!a) return;
            e.preventDefault();
            const url = a.href;
            window.parent.postMessage({ type: "navigate", url }, "*");
          });
        <\/script>
      ` + html;
    }

    window.addEventListener("message", async (e) => {
      if (e.data.type === "navigate") {
        load(e.data.url, true);
      }
    });

    function escapeHtml(str) {
      return str.replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>

</body>
</html>
