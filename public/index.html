<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HTML / CSS / JS Fetcher</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 200px; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>URL から HTML / CSS / JS を取得</h1>

  <input id="url" placeholder="https://example.com" style="width:80%">
  <button onclick="fetchCode()">取得</button>

  <h2>HTML</h2>
  <textarea id="html"></textarea>

  <h2>CSS</h2>
  <textarea id="css"></textarea>

  <h2>JS</h2>
  <textarea id="js"></textarea>

  <script>
    async function fetchCode() {
      const url = document.getElementById("url").value;

      const res = await fetch("/fetch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      const data = await res.json();

      document.getElementById("html").value = data.html || "";
      document.getElementById("css").value = data.css || "";
      document.getElementById("js").value = data.js || "";
    }
  </script>

</body>
</html>
